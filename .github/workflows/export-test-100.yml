name: Export locked 100 test trajectories

on:
  push:
    branches: [experiment/600-hybrid-skill-restart]
    paths:
      - ".github/workflows/export-test-100.yml"
      - "scripts/export_test_100.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-experiment.txt
      - run: pip install -r requirements-experiment.txt
      - run: python scripts/export_test_100.py
      - uses: actions/upload-artifact@v4
        with:
          name: reward-hacking-locked-test-100
          path: experiments/locked_test_inputs/
          retention-days: 10
          if-no-files-found: error
